name: CI (v2)

on:
  push:
    branches: [main]
    paths: ["birds-v2/**", ".github/workflows/ci-v2.yml"]
  pull_request:
    paths: ["birds-v2/**", ".github/workflows/ci-v2.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: birds-v2
    env:
      # Dummy values — the build must not need live services
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-secret-not-used-anywhere
      AUTH_GOOGLE_ID: ci-dummy
      AUTH_GOOGLE_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: birds-v2/package-lock.json

      - name: Install dependencies (runs prisma generate)
        run: npm ci

      # Blocking from day one — v2 starts with zero lint debt
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx next typegen && npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
