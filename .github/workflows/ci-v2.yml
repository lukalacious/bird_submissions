name: CI (v2)

on:
  push:
    branches: [main]
    paths: ["birds-v2/**", ".github/workflows/ci-v2.yml"]
  pull_request:
    paths: ["birds-v2/**", ".github/workflows/ci-v2.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: birds-v2
    env:
      # Dummy values — the build must not need live services
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-secret-not-used-anywhere
      AUTH_GOOGLE_ID: ci-dummy
      AUTH_GOOGLE_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: birds-v2/package-lock.json

      - name: Install dependencies (runs prisma generate)
        run: npm ci

      # Blocking from day one — v2 starts with zero lint debt
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx next typegen && npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: birds-v2
    env:
      DATABASE_URL: ${{ secrets.V2_STAGING_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.V2_STAGING_DATABASE_URL }}
      AUTH_GOOGLE_ID: ci-dummy
      AUTH_GOOGLE_SECRET: ci-dummy
    steps:
      - name: Skip until the staging secret exists
        id: gate
        working-directory: . # runs before checkout, so birds-v2/ doesn't exist yet
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "V2_STAGING_DATABASE_URL not set — skipping E2E"; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: birds-v2/package-lock.json

      - name: Install, build, run
        if: steps.gate.outputs.run == 'true'
        run: |
          # a fresh secret per run: the test server and the test sessions share it
          export AUTH_SECRET="$(openssl rand -base64 32)"
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure() && steps.gate.outputs.run == 'true'
        with:
          name: playwright-report
          path: birds-v2/playwright-report/
