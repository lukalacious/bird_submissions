name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: birds-app
    env:
      # Dummy values — build must not require live services
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-secret-not-used-in-production
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: birds-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking until the 75 pre-existing lint errors are cleaned up
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
